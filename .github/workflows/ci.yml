name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Verify core has no compile-scope dependencies beyond the JDK
        run: |
          tree_output="$(mvn -B -q -pl agentbudget-core dependency:tree -Dscope=compile)"
          echo "$tree_output"
          extra_deps="$(echo "$tree_output" | tail -n +2)"
          if [ -n "$extra_deps" ]; then
            echo "agentbudget-core must depend on the JDK only at compile scope, found:"
            echo "$extra_deps"
            exit 1
          fi
